name: Fetch starter media

# Downloads the starter photos and hero clips listed in scripts/media-manifest.json,
# compresses them for the web, and commits them to public/seed/.
# Runs when the manifest changes, or manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/media-manifest.json

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg jq
      - name: Download and compress
        run: |
          set -e
          mkdir -p public/seed tmp
          for name in $(jq -r '.images | keys[]' scripts/media-manifest.json); do
            url=$(jq -r --arg n "$name" '.images[$n]' scripts/media-manifest.json)
            curl -fsSL "$url" -o "tmp/$name.src"
            ffmpeg -y -loglevel error -i "tmp/$name.src" -vf "scale='min(1600,iw)':-2" -q:v 4 "public/seed/$name"
          done
          for name in $(jq -r '.videos | keys[]' scripts/media-manifest.json); do
            url=$(jq -r --arg n "$name" '.videos[$n]' scripts/media-manifest.json)
            curl -fsSL "$url" -o "tmp/$name.src"
            ffmpeg -y -loglevel error -i "tmp/$name.src" -an -vf "scale=1600:-2" -c:v libx264 -preset slow -crf 27 -pix_fmt yuv420p -movflags +faststart "public/seed/$name"
          done
          ls -la public/seed
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/seed
          git diff --cached --quiet || git commit -m "Add starter media"
          git push
