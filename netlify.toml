[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/seed/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Visual-editing preview: branch deploy rendered on demand with drafts.
# Its SANITY_API_READ_TOKEN is set in the Netlify UI (never in this file).
[context.visual-preview.environment]
  PUBLIC_SANITY_VISUAL_EDITING_ENABLED = "true"

